<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>企业季报跟踪 | YZ Research</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="switcher.css">
  <style>
    :root {
      --canvas: #ffffff;
      --surface: #f4f4f4;
      --surface-hover: #e8e8e8;
      --ink: #161616;
      --muted: #525252;
      --subtle: #8d8d8d;
      --line: #e0e0e0;
      --blue: #0f62fe;
      --blue-hover: #0050e6;
      --copper: #a84f2a;
      --zinc: #607787;
      --content: min(1120px, calc(100% - 64px));
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      background: var(--canvas);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    main {
      width: var(--content);
      min-height: calc(100vh - 136px);
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    .page-head {
      min-height: 156px;
      padding-bottom: 32px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 40px;
      border-bottom: 1px solid var(--ink);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    h1 {
      margin: 0;
      font-size: 40px;
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .as-of {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      text-align: right;
      white-space: nowrap;
    }

    .as-of strong {
      display: block;
      color: var(--ink);
      font-size: 24px;
      font-weight: 400;
    }

    .panels {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .panel-link {
      min-width: 0;
      color: inherit;
      background: var(--canvas);
      border: 1px solid var(--line);
      border-top: 0;
      text-decoration: none;
      transition: background-color 160ms ease, border-color 160ms ease;
    }

    .panel-link + .panel-link { border-left: 0; }

    .panel-link:hover {
      z-index: 1;
      background: var(--surface);
      border-color: var(--ink);
    }

    .panel-link:focus-visible {
      position: relative;
      z-index: 2;
      outline: 3px solid var(--blue);
      outline-offset: -3px;
    }

    .panel-top {
      min-height: 52px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }

    .metal-id {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .swatch {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
    }

    .copper .swatch { background: var(--copper); }
    .zinc .swatch { background: var(--zinc); }

    .panel-body {
      min-height: 240px;
      padding: 32px;
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) 48px;
      align-items: center;
      gap: 28px;
    }

    .element-mark {
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 34px;
      font-weight: 650;
    }

    .copper .element-mark { background: var(--copper); }
    .zinc .element-mark { background: var(--zinc); }

    h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .meta {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .arrow {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--blue);
      font-size: 24px;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .panel-link:hover .arrow {
      background: var(--blue-hover);
      transform: translateX(2px);
    }

    footer {
      min-height: 88px;
      color: #c6c6c6;
      background: var(--ink);
    }

    .footer-inner {
      width: var(--content);
      min-height: 88px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      font-size: 12px;
    }

    .footer-inner a {
      color: #fff;
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
    }

    .footer-inner a:hover { text-decoration: underline; }

    @media (max-width: 760px) {
      :root { --content: min(100% - 32px, 640px); }

      main { padding: 32px 0 48px; }

      .page-head {
        min-height: 140px;
        align-items: flex-start;
        flex-direction: column;
        gap: 20px;
      }

      h1 { font-size: 34px; }

      .as-of { text-align: left; }

      .panels { grid-template-columns: 1fr; }
      .panel-link + .panel-link { border-left: 1px solid var(--line); }

      .panel-body {
        min-height: 184px;
        padding: 24px;
        grid-template-columns: 72px minmax(0, 1fr) 44px;
        gap: 18px;
      }

      .element-mark {
        width: 72px;
        height: 72px;
        font-size: 27px;
      }

      .arrow { width: 44px; height: 44px; }
    }

    @media (max-width: 440px) {
      :root { --content: calc(100% - 24px); }

      h1 { font-size: 30px; }
      .panel-top { padding: 0 14px; }

      .panel-body {
        min-height: 170px;
        padding: 20px 14px;
        grid-template-columns: 60px minmax(0, 1fr) 40px;
        gap: 12px;
      }

      .element-mark {
        width: 60px;
        height: 60px;
        font-size: 23px;
      }

      h2 { font-size: 21px; }
      .meta { font-size: 11px; }
      .arrow { width: 40px; height: 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .panel-link,
      .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <header class="tracker-switcher">
    <div class="tracker-switcher__inner">
      <a class="tracker-switcher__brand" href="https://yzkkk-study.github.io/research/" aria-label="返回 YZ Research 首页">
        <span class="tracker-switcher__mark" aria-hidden="true"></span>
        <span>YZ Research</span>
      </a>
      <nav class="tracker-switcher__nav" aria-label="矿企跟踪面板">
        <a class="tracker-switcher__link" href="copper/">铜矿企业</a>
        <a class="tracker-switcher__link" href="zinc/">锌矿企业</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-head" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">COMPANY QUARTERLY REVIEW</p>
        <h1 id="page-title">企业季报跟踪</h1>
      </div>
      <p class="as-of"><strong>2026Q1</strong>共同完整季度</p>
    </section>

    <nav class="panels" aria-label="选择矿企跟踪面板">
      <a class="panel-link copper" href="copper/" aria-label="打开铜矿企业季度跟踪看板">
        <div class="panel-top">
          <span class="metal-id"><span class="swatch" aria-hidden="true"></span>01 / COPPER</span>
          <span>24 家企业</span>
        </div>
        <div class="panel-body">
          <span class="element-mark" aria-hidden="true">Cu</span>
          <div>
            <h2>铜矿企业季度跟踪</h2>
            <p class="meta">产量指引 · 企业经营 · 矿山贡献 · 项目进展</p>
          </div>
          <span class="arrow" aria-hidden="true">→</span>
        </div>
      </a>

      <a class="panel-link zinc" href="zinc/" aria-label="打开锌矿企业季度跟踪看板">
        <div class="panel-top">
          <span class="metal-id"><span class="swatch" aria-hidden="true"></span>02 / ZINC</span>
          <span>30 家企业</span>
        </div>
        <div class="panel-body">
          <span class="element-mark" aria-hidden="true">Zn</span>
          <div>
            <h2>锌矿企业季度跟踪</h2>
            <p class="meta">产量指引 · 企业经营 · 矿山贡献 · 项目进展</p>
          </div>
          <span class="arrow" aria-hidden="true">→</span>
        </div>
      </a>
    </nav>
  </main>

  <footer>
    <div class="footer-inner">
      <a href="https://yzkkk-study.github.io/research/">YZ Research</a>
      <span>Copper companies · Zinc companies</span>
    </div>
  </footer>
</body>
</html>
